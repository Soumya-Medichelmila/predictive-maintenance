version: "3.9"

services:

  db:
    image: postgres:14
    container_name: predictive_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: predictive_maintenance

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: predictive_api

    depends_on:
      - db

    env_file:
      - .env.docker

    ports:
      - "8000:8000"

volumes:
  postgres_data: